# Atteo for iOS. Generate the Xcode project with: cd ios && xcodegen
# (Atteo.xcodeproj is generated, not committed.)
name: Atteo
options:
  bundleIdPrefix: com.atteo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Atteo:
    type: application
    platform: iOS
    sources:
      - AgentSoup/Sources
      - AgentSoup/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atteo.app
        PRODUCT_NAME: Atteo
        INFOPLIST_FILE: AgentSoup/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  AtteoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AgentSoupUITests
    dependencies:
      - target: Atteo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atteo.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Atteo
schemes:
  Atteo:
    build:
      targets:
        Atteo: all
        AtteoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtteoUITests
