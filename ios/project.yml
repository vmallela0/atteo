# Atteo for iOS. Generate the Xcode project with: cd ios && xcodegen
# (Atteo.xcodeproj is generated, not committed.)
name: Atteo
options:
  bundleIdPrefix: com.atteo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Product analytics (Analytics.swift, vedu #4416): PostHog's iOS SDK.
# Crash reporting (CrashReporting.swift, vedu #4640): Sentry Cocoa, off until a DSN is set (docs/SENTRY.md).
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.90.1 # pinned: Atteo.xcodeproj (and its Package.resolved) is generated, not committed
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.30.0 # pinned: same reason as PostHog
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Crash reporting DSN (CrashReporting.swift). Empty = off. Do not commit a real value.
    SENTRY_DSN: ""
    # Interface languages (vedu #1645): Localizable.xcstrings and InfoPlist.xcstrings in AgentSoup/Resources.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # The app's bundle id; the share extension is "<it>.share", the notification extension "<it>.notify". Override
    # THIS (not PRODUCT_BUNDLE_IDENTIFIER, which would give the extensions the app's own id) to build for another id,
    # e.g. the phones' free-team build:
    #   xcodebuild … ATTEO_BUNDLE_ID=com.agentsoup.app DEVELOPMENT_TEAM=T3627N2VC4 -allowProvisioningUpdates
    ATTEO_BUNDLE_ID: com.atteo.app
targets:
  Atteo:
    type: application
    platform: iOS
    sources:
      - AgentSoup/Sources
      - AgentSoup/Resources
      - Shared
    dependencies:
      - target: AtteoShare
      - target: AtteoNotify
      - package: PostHog
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATTEO_BUNDLE_ID)
        PRODUCT_NAME: Atteo
        INFOPLIST_FILE: AgentSoup/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentSoup/Atteo.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  AtteoShare:
    # Atteo in the share sheet (vedu #4110): ShareExtension/ + Shared/ShareCore.swift. It reads the app's sign-in from
    # the Keychain group both entitlements name (the app's own application identifier).
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared
        excludes:
          - SealedOpen.swift # board keys: the app and AtteoNotify only
          - ScanRules.swift
      - path: AgentSoup/Resources/Fonts/Onest-Regular.ttf
        buildPhase: resources
      - path: AgentSoup/Resources/Fonts/Onest-Medium.ttf
        buildPhase: resources
      - path: AgentSoup/Resources/Fonts/Onest-SemiBold.ttf
        buildPhase: resources
      - path: AgentSoup/Resources/Fonts/Enriqueta-SemiBold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATTEO_BUNDLE_ID).share
        PRODUCT_NAME: AtteoShare
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/AtteoShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
  AtteoNotify:
    # The notification extension (E2E 1b): a push for an end-to-end encrypted board carries ciphertext, and this shows
    # the real words with the board key the app keeps in the board keys' own Keychain group, "<app id>.e2e"
    # (Shared/SealedOpen.swift). That's its only group: not the sign-in's, and AtteoShare isn't entitled to this one.
    type: app-extension
    platform: iOS
    sources:
      - NotifyExtension
      - Shared/SealedOpen.swift
      - Shared/ScanRules.swift # a push's words are checked as the app checks them
      - path: AgentSoup/Resources/ClientScan.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATTEO_BUNDLE_ID).notify
        PRODUCT_NAME: AtteoNotify
        INFOPLIST_FILE: NotifyExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotifyExtension/AtteoNotify.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
  AtteoTests:
    # Unit tests (no server): the code-block tokenizer (SyntaxHighlight.swift).
    type: bundle.unit-test
    platform: iOS
    sources:
      - AtteoTests
    dependencies:
      - target: Atteo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atteo.app.tests
        GENERATE_INFOPLIST_FILE: YES
  AtteoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AgentSoupUITests
    dependencies:
      - target: Atteo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atteo.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Atteo
schemes:
  Atteo:
    build:
      targets:
        Atteo: all
        AtteoTests: [test]
        AtteoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtteoTests
        - AtteoUITests
