name: CI

# The backstop, not the gate: the local gate already runs every suite on a fresh server before anything reaches main.
# - Every 2 hours on main, only if main changed since the last finished run: typecheck, unit tests, and the end-to-end and
#   CLI suites against a local Worker (wrangler dev, local D1 + Durable Objects). ~1 billed minute when nothing changed,
#   ~5 when it did.
# - Nightly, and by hand ("Run workflow", any branch): all of that plus the browser checks in 4 shards (~22 minutes).
# - Pull requests: the test job only.
# The private repo has 2,000 free minutes a month; a full run on every main push used them up in 4 days (10-04, #1981,
# #1989, #2000, #2001).
on:
  schedule:
    - cron: "17 10 * * *" # nightly full run, ~3am Pacific
    - cron: "47 */2 * * *" # every 2 hours, test job only, when main moved
  pull_request:
  workflow_dispatch:

concurrency:
  # Scheduled runs never cancel each other (a late nightly full run would lose to the next 2-hourly one); a new push to a
  # pull request still cancels its older run.
  group: ci-${{ github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The 2-hourly run: has main moved since the last green CI run on main? (Nothing else uses this job.)
  changed:
    if: github.event_name == 'schedule' && github.event.schedule == '47 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last finished run, green or red: a red main that hasn't moved isn't retested every 2 hours.
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "main hasn't moved since the last run"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: [changed]
    if: ${{ !cancelled() && (needs.changed.result == 'skipped' || needs.changed.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build CLI
        run: npm run build:cli

      - name: Start a local Worker
        run: scripts/ci-worker.sh

      - name: End-to-end tests
        run: DEV_LOG=wrangler.log E2E_FULL=1 node test/e2e.mjs

      - name: CLI tests
        run: node test/cli.mjs

      - name: SDK tests (TypeScript asks, Python answers)
        run: node test/sdk.mjs

      - name: Worker log on failure
        if: failure()
        run: tail -200 wrangler.log

  # The ~80 Playwright browser checks (test/browser, docs/ci.md), split across 4 jobs that each start their own local
  # Worker. Chromium comes from playwright-core's installer, cached by its version.
  browser:
    name: browser (${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request' && github.event.schedule != '47 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build CLI (e2e-web drives the real CLI)
        run: npm run build:cli

      - name: playwright-core version
        id: pw
        run: echo "version=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Restore cached Chromium
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then npx playwright-core install-deps chromium; else npx playwright-core install --with-deps --no-shell chromium; fi
          echo "PW_CHROME=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"

      # Saved right away (not at the end of the job), so a red run still fills the cache; the other shards' saves of
      # the same key are skipped with a warning.
      - name: Cache Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Start a local Worker
        run: scripts/ci-worker.sh

      - name: Browser checks
        env:
          BASE: http://localhost:8787
          SHARD: ${{ matrix.shard }}/4
          PAR: 3
          SHOTS_DIR: ${{ runner.temp }}/browser
        run: npm run test:browser

      - name: Collect the Worker log
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp wrangler.log "$RUNNER_TEMP/browser/" 2>/dev/null || echo "no wrangler.log"

      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser
          retention-days: 7
          if-no-files-found: ignore

  # The CI bot (vedu #1183): each push's result goes onto its change card on the Atteo board, and a failure pings the
  # author and their agent with the failing step. Posts with a board token like any agent (docs/ci-bot.md); without
  # the ATTEO_BOT_TOKEN secret it only leaves a notice. Never turns a run red.
  report:
    needs: [test, browser]
    if: ${{ github.event_name != 'pull_request' && github.event.schedule != '47 */2 * * *' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read # the failing step's name, from this run's jobs
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-report.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post the result to the Atteo board
        env:
          ATTEO_BOT_TOKEN: ${{ secrets.ATTEO_BOT_TOKEN }}
          ATTEO_URL: ${{ vars.ATTEO_URL }}
          ATTEO_BOARD: ${{ vars.ATTEO_BOARD }}
          CI_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-report.mjs
