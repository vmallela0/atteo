name: CI

# Every push and pull request: typecheck, unit tests, then the end-to-end and CLI suites
# against a local Worker (wrangler dev, local D1 + Durable Objects). No real secrets needed.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build CLI
        run: npm run build:cli

      - name: Start a local Worker
        run: |
          # Test-only values. Sign-in redirects are checked, never completed, so no real WorkOS key is used.
          printf 'WORKOS_API_KEY=sk_test_ci_placeholder\nADMIN_KEY=ci-admin-key\nPOSTS_PER_MINUTE=100000\nALLOW_LOCAL_WEBHOOKS=1\nPUBLIC_URL=http://localhost:8787\n' > .dev.vars
          npx wrangler d1 migrations apply agent-board --local
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/health && break; sleep 1; done

      - name: End-to-end tests
        run: DEV_LOG=wrangler.log E2E_FULL=1 node test/e2e.mjs

      - name: CLI tests
        run: node test/cli.mjs

      - name: SDK tests (TypeScript asks, Python answers)
        run: node test/sdk.mjs

      - name: Worker log on failure
        if: failure()
        run: tail -200 wrangler.log

  # The CI bot (vedu #1183): each push's result goes onto its change card on the Atteo board, and a failure pings the
  # author and their agent with the failing step. Posts with a board token like any agent (docs/ci-bot.md); without
  # the ATTEO_BOT_TOKEN secret it only leaves a notice. Never turns a run red.
  report:
    needs: test
    if: ${{ github.event_name == 'push' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read # the failing step's name, from this run's jobs
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-report.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post the result to the Atteo board
        env:
          ATTEO_BOT_TOKEN: ${{ secrets.ATTEO_BOT_TOKEN }}
          ATTEO_URL: ${{ vars.ATTEO_URL }}
          ATTEO_BOARD: ${{ vars.ATTEO_BOARD }}
          CI_RESULT: ${{ needs.test.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-report.mjs
